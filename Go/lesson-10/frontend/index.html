<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Go Mongo Chat</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="container">

        <h1>Go Mongo Chat</h1>

        <div class="form">

            <input
                id="username"
                type="text"
                placeholder="Ваше имя"
            >

            <input
                id="room"
                type="text"
                placeholder="Комната"
                value="general"
            >

            <textarea
                id="message"
                placeholder="Введите сообщение"
            ></textarea>

            <button id="sendButton">
                Отправить
            </button>

        </div>


        <div class="header">

            <h2>Сообщения</h2>

            <button
                id="refreshButton"
                class="secondary"
            >
                Обновить
            </button>

        </div>


        <div id="messages">

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
